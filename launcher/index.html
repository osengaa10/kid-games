<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <title>Kid Games</title>
    <style>
      :root {
        --card: min(27vw, 52vh);
        --ring: clamp(5px, 1.1vmin, 10px);
        --font: ui-rounded, 'SF Pro Rounded', 'Arial Rounded MT Bold', system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        position: fixed;
        inset: 0;
        background: linear-gradient(#3aa6f5, #c9ecff 75%);
        font-family: var(--font);
      }

      /* The scenery: a sun, clouds and two hills. */
      .sky {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .sun {
        transform-box: fill-box;
        transform-origin: center;
        animation: spin 30s linear infinite;
      }
      .cloud {
        animation: drift 14s ease-in-out infinite alternate;
      }
      .cloud.b {
        animation-duration: 19s;
        animation-direction: alternate-reverse;
      }

      main {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(14px, 4vh, 40px);
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      h1 {
        margin: 0;
        font-size: clamp(40px, 9vmin, 96px);
        font-weight: 900;
        line-height: 1;
        letter-spacing: 2px;
        -webkit-text-stroke: clamp(2px, 0.5vmin, 5px) #fff;
        paint-order: stroke fill;
        text-shadow: 0 6px 0 rgba(0, 0, 0, 0.18);
      }
      h1 span {
        display: inline-block;
        animation: hop 2.4s ease-in-out infinite;
      }
      .tagline {
        margin: calc(-1 * clamp(8px, 2.5vh, 26px)) 0 0;
        font-size: clamp(13px, 2.1vmin, 20px);
        font-weight: 700;
        color: #1d5f99;
        opacity: 0.8;
      }

      .games {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(16px, 4vmin, 48px);
      }
      .game {
        width: var(--card);
        aspect-ratio: 1;
        padding: 0;
        border: var(--ring) solid #fff;
        border-radius: clamp(22px, 5vmin, 44px);
        overflow: hidden;
        background: #fff;
        box-shadow: 0 calc(var(--ring) * 1.6) 0 rgba(0, 0, 0, 0.18), 0 16px 30px rgba(0, 0, 0, 0.22);
        cursor: pointer;
        touch-action: manipulation;
        animation: bob 2.8s ease-in-out infinite;
      }
      .game:nth-child(2) {
        animation-delay: -0.9s;
      }
      .game:nth-child(3) {
        animation-delay: -1.8s;
      }
      .game img {
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .game.on {
        animation: none;
        transform: scale(0.9);
        transition: transform 0.1s;
      }

      /* An iPad held upright: stack the games. */
      @media (orientation: portrait) {
        :root {
          --card: min(56vw, 22vh);
        }
        .games {
          flex-direction: column;
        }
      }

      @keyframes bob {
        0%, 100% { transform: translateY(0) rotate(-1.5deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes hop {
        0%, 70%, 100% { transform: translateY(0); }
        80% { transform: translateY(-10px); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes drift {
        to { transform: translateX(40px); }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <svg class="sky" viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <g class="sun">
        <circle cx="350" cy="46" r="22" fill="#ffe14d" />
        <path d="M350 14v-8M350 78v8M318 46h-8M382 46h8M327 23l-6-6M373 69l6 6M327 69l-6 6M373 23l6-6" stroke="#ffe14d" stroke-width="4" stroke-linecap="round" />
      </g>
      <g fill="#fff" opacity="0.95">
        <g class="cloud"><circle cx="40" cy="50" r="12" /><circle cx="56" cy="42" r="16" /><circle cx="73" cy="50" r="11" /></g>
        <g class="cloud b"><circle cx="230" cy="34" r="9" /><circle cx="243" cy="28" r="12" /><circle cx="256" cy="35" r="8" /></g>
      </g>
      <path d="M-20 262q110-46 220-8t220-4V320H-20z" fill="#7bd36a" />
      <path d="M-20 284q140-26 260-4t180 2V320H-20z" fill="#5cc94f" />
      <g fill="#ff5d73"><circle cx="40" cy="292" r="3" /><circle cx="150" cy="298" r="3" /><circle cx="300" cy="294" r="3" /></g>
      <g fill="#ffd23f"><circle cx="90" cy="298" r="3" /><circle cx="230" cy="292" r="3" /><circle cx="360" cy="298" r="3" /></g>
    </svg>

    <main>
      <h1 aria-label="Kid Games"></h1>
      <p class="tagline">Games for kids who can't read good</p>
      <nav class="games">
        <button class="game" data-game="lawn-mower" data-say="Mighty Mower!" aria-label="Mighty Mower">
          <img src="games/lawn-mower/icons/icon-512.png" alt="" />
        </button>
        <button class="game" data-game="roller-coaster" data-say="Coaster Doodle!" aria-label="Coaster Doodle">
          <img src="games/roller-coaster/icons/icon-512.png" alt="" />
        </button>
        <button class="game" data-game="monster-truck" data-say="Monster Truck!" aria-label="Monster Truck">
          <img src="games/monster-truck/icons/icon-512.png" alt="" />
        </button>
      </nav>
    </main>

    <script>
      // The title, one candy color per letter, each hopping in turn.
      const COLORS = ['#ff5252', '#ffab40', '#ffd740', '#69f0ae', '#40c4ff', '#b388ff'];
      const h1 = document.querySelector('h1');
      [...'Kid Games'].forEach((ch, i) => {
        const s = document.createElement('span');
        s.textContent = ch === ' ' ? ' ' : ch;
        s.style.color = COLORS[i % COLORS.length];
        s.style.animationDelay = `${i * 0.08}s`;
        h1.appendChild(s);
      });

      // A little "pop" so a tap feels like it did something.
      let audio;
      function pop() {
        try {
          audio ||= new (window.AudioContext || window.webkitAudioContext)();
          const t = audio.currentTime;
          const o = audio.createOscillator();
          const g = audio.createGain();
          o.frequency.setValueAtTime(500, t);
          o.frequency.exponentialRampToValueAtTime(1100, t + 0.08);
          g.gain.setValueAtTime(0.25, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
          o.connect(g).connect(audio.destination);
          o.start(t);
          o.stop(t + 0.16);
        } catch {
          /* no sound, no problem */
        }
      }

      function say(text) {
        try {
          const synth = window.speechSynthesis;
          if (!synth) return;
          synth.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.rate = 1;
          u.pitch = 1.2;
          synth.speak(u);
        } catch {
          /* no voice, no problem */
        }
      }

      let leaving = false;
      for (const btn of document.querySelectorAll('.game')) {
        btn.addEventListener('click', () => {
          if (leaving) return;
          leaving = true;
          btn.classList.add('on');
          pop();
          say(btn.dataset.say);
          setTimeout(() => {
            location.href = `games/${btn.dataset.game}/index.html`;
          }, 700);
        });
      }
      // Coming back with the back/forward cache: be ready for the next tap.
      window.addEventListener('pageshow', () => {
        leaving = false;
        for (const b of document.querySelectorAll('.game.on')) b.classList.remove('on');
      });

      // Block pinch-zoom and long-press menus.
      for (const ev of ['gesturestart', 'gesturechange', 'contextmenu', 'dblclick']) {
        document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
      }
    </script>
  </body>
</html>
