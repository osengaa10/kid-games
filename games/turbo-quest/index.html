<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Turbo Quest" />
    <meta name="theme-color" content="#3fa9f5" />
    <meta name="format-detection" content="telephone=no" />
    <title>Turbo Quest</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- The game view, then the buttons and score on top at full sharpness. -->
    <canvas id="world"></canvas>
    <canvas id="ui"></canvas>
    <!-- Held upright: a turning iPad asks to be held sideways. -->
    <div id="rotate" aria-label="Turn the iPad sideways"><div>📱</div></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
