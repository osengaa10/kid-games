<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <title>Kid Games</title>
    <style>
      :root {
        --bg: #1f72b4;
        --bubble: rgba(255, 255, 255, 0.07);
        --hill: #1f9bab;
        --ink: #163a63;
        --gap: clamp(14px, 3.6vw, 56px);
        /* Card width: three across, small enough that the cards and the heading fit the height. */
        --card: min(28vw, calc((100dvh - 15rem) / 1.36), 420px);
        --radius: clamp(16px, calc(var(--card) * 0.07), 30px);
        --font: system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        position: fixed;
        inset: 0;
        background: var(--bg);
        font-family: var(--font);
        color: #fff;
      }

      /* Background shapes: two soft circles and a teal hill. */
      .shape {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }
      .shape.a {
        width: 95vmax;
        height: 60vmax;
        left: -38vmax;
        top: -38vmax;
        background: var(--bubble);
      }
      .shape.b {
        width: 80vmax;
        height: 80vmax;
        right: -42vmax;
        top: -12vmax;
        background: var(--bubble);
      }
      .shape.hill {
        width: 120vmax;
        height: 70vmax;
        left: -42vmax;
        bottom: -42vmax;
        background: var(--hill);
      }

      main {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(18px, 5vh, 64px);
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom))
          max(16px, env(safe-area-inset-left));
        box-sizing: border-box;
      }

      header {
        text-align: center;
      }
      h1 {
        margin: 0;
        /* A long line: sized to fit one line across a tablet, wrapping evenly on a narrow phone. */
        font-size: clamp(26px, min(6.4vmin, 3.6vw), 84px);
        text-wrap: balance;
        font-weight: 800;
        letter-spacing: 0.04em;
        line-height: 1.05;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.12);
      }
      .hint {
        margin: 0.35em 0 0;
        font-size: clamp(15px, 2.6vmin, 30px);
        opacity: 0.88;
      }

      .games {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: var(--gap);
      }
      .game {
        width: var(--card);
        container-type: inline-size;
        display: flex;
        flex-direction: column;
        padding: 0;
        border: 0;
        border-radius: var(--radius);
        overflow: hidden;
        background: #fff;
        box-shadow: 0 18px 36px rgba(6, 30, 60, 0.35);
        font: inherit;
        cursor: pointer;
        touch-action: manipulation;
        animation: bob 3.2s ease-in-out infinite;
      }
      .game:nth-child(2) {
        animation-delay: -1.07s;
      }
      .game:nth-child(3) {
        animation-delay: -2.13s;
      }
      .game img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        pointer-events: none;
      }
      .game span {
        display: grid;
        place-items: center;
        min-height: 36cqi;
        padding: 0 4cqi;
        border-top: 1px solid #e6ebf1;
        color: var(--ink);
        font-size: 8.6cqi;
        font-weight: 800;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .game.on {
        animation: none;
        transform: scale(0.93);
        transition: transform 0.1s;
      }

      /* A phone held upright: stack the games, picture beside the name. */
      @media (max-aspect-ratio: 5/8) {
        :root {
          --card: min(88vw, 460px);
        }
        .games {
          flex-direction: column;
          align-items: center;
        }
        .game {
          flex-direction: row;
          align-items: stretch;
        }
        .game img {
          width: 38%;
        }
        .game span {
          flex: 1;
          min-height: 0;
          border-top: 0;
          border-left: 1px solid #e6ebf1;
          font-size: 6.2cqi;
          white-space: normal;
          text-align: center;
        }
      }

      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .game { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="shape a" aria-hidden="true"></div>
    <div class="shape b" aria-hidden="true"></div>
    <div class="shape hill" aria-hidden="true"></div>

    <main>
      <header>
        <h1>GAMES FOR KIDS WHO CAN'T READ GOOD</h1>
        <p class="hint">Tap a picture to play</p>
      </header>
      <nav class="games">
        <button class="game" data-game="lawn-mower" data-say="Mighty Mower!">
          <img src="images/lawn-mower.jpg" alt="" />
          <span>Mighty Mower</span>
        </button>
        <button class="game" data-game="roller-coaster" data-say="Coaster Doodle!">
          <img src="images/roller-coaster.jpg" alt="" />
          <span>Coaster Doodle</span>
        </button>
        <button class="game" data-game="monster-truck" data-say="Monster Truck!">
          <img src="images/monster-truck.jpg" alt="" />
          <span>Monster Truck</span>
        </button>
      </nav>
    </main>

    <script>
      // A little "pop" so a tap feels like it did something.
      let audio;
      function pop() {
        try {
          audio ||= new (window.AudioContext || window.webkitAudioContext)();
          const t = audio.currentTime;
          const o = audio.createOscillator();
          const g = audio.createGain();
          o.frequency.setValueAtTime(500, t);
          o.frequency.exponentialRampToValueAtTime(1100, t + 0.08);
          g.gain.setValueAtTime(0.25, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
          o.connect(g).connect(audio.destination);
          o.start(t);
          o.stop(t + 0.16);
        } catch {
          /* no sound, no problem */
        }
      }

      // Say the game's name, for kids who can't read the card yet.
      function say(text) {
        try {
          const synth = window.speechSynthesis;
          if (!synth) return;
          synth.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.pitch = 1.2;
          synth.speak(u);
        } catch {
          /* no voice, no problem */
        }
      }

      let leaving = false;
      for (const btn of document.querySelectorAll('.game')) {
        btn.addEventListener('click', () => {
          if (leaving) return;
          leaving = true;
          btn.classList.add('on');
          pop();
          say(btn.dataset.say);
          setTimeout(() => {
            location.href = `games/${btn.dataset.game}/index.html`;
          }, 700);
        });
      }
      // Coming back with the back/forward cache: be ready for the next tap.
      window.addEventListener('pageshow', () => {
        leaving = false;
        for (const b of document.querySelectorAll('.game.on')) b.classList.remove('on');
      });

      // Block pinch-zoom and long-press menus.
      for (const ev of ['gesturestart', 'gesturechange', 'contextmenu', 'dblclick']) {
        document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
      }
    </script>
  </body>
</html>
